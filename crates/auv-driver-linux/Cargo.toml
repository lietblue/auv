[package]
name = "auv-driver-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autoexamples = false

[features]
default = []
# TODO(driver-overlay-linux): add the Linux adapter after its compositor/session
# ownership is approved; the shared feature exists now so `auv-driver/overlay`
# remains portable without claiming rendered support.
overlay = []

[[example]]
name = "validate"
path = "examples/validate.rs"

[dependencies]
auv-driver-common = { path = "../auv-driver-common" }
image.workspace = true
serde.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
leptess.workspace = true
pipewire = "0.8"
tempfile.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.9", default-features = false }
zbus.workspace = true
